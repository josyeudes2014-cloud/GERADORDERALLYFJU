name: Assemble Rally index

on:
  push:
    branches: [main]
    paths:
      - '.build/index-ready'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble and validate public index
        shell: bash
        run: |
          set -euo pipefail
          cat .build/index.*.bin > /tmp/index.html.xz
          xz -dc /tmp/index.html.xz > public/index.html
          test -s public/index.html
          grep -q '<title>RALLY FJU DO IDE</title>' public/index.html
          grep -q 'projectId: "rallyfjuniteroi"' public/index.html
          grep -q "user.email === 'admin@rallyfju.com'" public/index.html
          if grep -q 'site-teste-25002' public/index.html; then
            echo 'Legacy Firebase project found' >&2
            exit 1
          fi
          test "$(sha256sum public/index.html | awk '{print $1}')" = 'b20347a4a7cd84bf53815cedcd102e5879927eed96fb42b097e92f5ffbf842cc'

      - name: Commit complete index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Add complete Rally FJU do IDE index'
            git push
          fi
